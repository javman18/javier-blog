<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}} — Javier</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="stylesheet" href="{{STYLE_HREF}}" />
</head>

<body>
  <div class="wrap">
    <header class="site-header">
      <div class="brand-wrap">
        <div class="brand-row">
          <a class="brand" href="{{HOME_HREF}}">Javier</a>
          <nav class="top-nav" aria-label="{{NAV_ARIA}}">
{{NAV_LINKS}}
          </nav>
        </div>
        <p class="subtitle">{{SUBTITLE}}</p>
      </div>
    </header>

    <main class="post-main">
      <article class="post">
        <header class="post-header">
          <h1 class="post-title-h1">{{H1}}</h1>
          <div class="meta">
            <time>{{DATE_LABEL}}</time> · {{SECTION_LABEL}}
          </div>
          {{TAGS_HTML}}
        </header>

        <section class="post-content">
{{CONTENT}}
        </section>

        <section class="comments">
          <h2>{{COMMENTS_HEADING}}</h2>
          <div class="comments-host"></div>
        </section>

        <footer class="post-footer">
          <nav class="post-nav">
            <a href="{{HOME_HREF}}">{{BACK_HOME_TEXT}}</a>
          </nav>
        </footer>
      </article>
    </main>

    <footer class="site-footer">
      <p class="muted">© 2026 Javier</p>
    </footer>
  </div>

  <script src="{{GISCUS_SRC}}" defer></script>

  <script data-goatcounter="https://javierfuente.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <noscript>
    <img src="https://javierfuente.goatcounter.com/count?p=/noscript" alt="">
  </noscript>
</body>
</html>
